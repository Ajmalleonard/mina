name: Sync API runtime environment to VPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the local API environment and restart only API
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_ENV_B64: ${{ secrets.TEMP_API_ENV_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: API_ENV_B64
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            test -n "$API_ENV_B64"
            repo_dir="/home/apps/sq/mina"
            env_file="$repo_dir/apps/api/.env"
            temp_file="$(mktemp /tmp/mina-api-env.XXXXXX)"
            trap 'rm -f "$temp_file"' EXIT
            printf '%s' "$API_ENV_B64" | base64 --decode > "$temp_file"
            test -s "$temp_file"
            chmod 600 "$temp_file"
            install -m 600 "$temp_file" "$env_file"
            image="$(docker inspect --format '{{.Config.Image}}' mina-api)"
            image_tag="${image##*:}"
            echo "Restarting only mina-api with the updated VPS environment and existing image $image_tag"
            docker compose -f "$repo_dir/deploy/docker-compose.yml" stop api
            IMAGE_TAG="$image_tag" docker compose -f "$repo_dir/deploy/docker-compose.yml" up -d --no-deps --force-recreate api
            for attempt in $(seq 1 60); do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' mina-api 2>/dev/null || true)"
              if test "$health" = healthy; then
                echo "mina-api is healthy with the synced environment"
                exit 0
              fi
              sleep 2
            done
            echo "mina-api did not become healthy after environment sync" >&2
            exit 1
