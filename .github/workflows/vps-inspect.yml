name: Inspect Mina VPS routing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Mina deployment state without changing it
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: SUDO_PASSWORD
          script_stop: true
          script: |
            set -euo pipefail
            echo "== Root credential variable names and sudo access =="
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' -v >/dev/null 2>&1 && echo "sudo authentication via SSH credential available" || echo "SSH credential cannot authenticate sudo"
            echo "== Mina related containers =="
            docker ps -a --format '{{.Names}}|{{.Status}}|{{.Ports}}' | grep -Ei 'mina|travel-engine' || true
            docker inspect --format '{{.Name}}|{{.State.Status}}|{{.Config.Image}}|{{json .NetworkSettings.Ports}}' mina-api 2>/dev/null || true
            docker inspect --format '{{.Name}}|{{.State.Status}}|{{.Config.Image}}' mina-panel 2>/dev/null || true
            docker inspect --format '{{.Name}}|{{.State.Status}}|{{.State.Error}}|{{.Config.Image}}|{{json .HostConfig.PortBindings}}' mina-web 2>/dev/null || true
            echo "== Mina PM2 processes =="
            if command -v pm2 >/dev/null 2>&1; then
              pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s)) if(/mina|travel-engine/i.test(p.name)||String(p.pm2_env.pm_cwd||"").includes("/mina")) console.log(p.name+"|"+p.pm2_env.status+"|"+p.pid+"|"+(p.pm2_env.pm_cwd||""))})'
            fi
            echo "== Mina processes in root PM2 =="
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const p of JSON.parse(s)) if(/mina|travel-engine/i.test(p.name)||String(p.pm2_env.pm_cwd||"").includes("/mina")) console.log(p.name+"|"+p.pm2_env.status+"|"+p.pid+"|"+(p.pm2_env.pm_cwd||""))}catch{}})' || true
            echo "== API Prisma migrations on VPS =="
            find /home/apps/sq/mina/apps/api/prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql -printf '%h\n' 2>/dev/null | sort || true
            echo "== API database migration status =="
            if test -x /home/apps/sq/mina/apps/api/node_modules/.bin/prisma || command -v bunx >/dev/null 2>&1; then
              cd /home/apps/sq/mina/apps/api
              if command -v bunx >/dev/null 2>&1; then bunx prisma migrate status || true; else ./node_modules/.bin/prisma migrate status || true; fi
              cd /home/apps/sq/mina
            fi
            echo "== Activity table columns visible to the API container =="
            docker exec mina-api node -e 'const {Client}=require("pg");(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();const r=await c.query("SELECT column_name FROM information_schema.columns WHERE table_schema = $1 AND table_name = $2 ORDER BY ordinal_position",["public","Activity"]);console.log(r.rows.map(x=>x.column_name).join(","));await c.end()})().catch(e=>{console.log("column inspection failed: "+(e.code||e.name));process.exitCode=1})' || true
            echo "== Activities with map locations =="
            docker exec mina-api node -e 'const {Client}=require("pg");(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();const r=await c.query("SELECT COUNT(*)::int AS total, COUNT(*) FILTER (WHERE \"impactLat\" IS NOT NULL AND \"impactLng\" IS NOT NULL)::int AS mapped FROM \"Activity\"");console.log(`activities_total=${r.rows[0].total}; activities_with_impact_location=${r.rows[0].mapped}`);await c.end()})().catch(e=>{console.log("impact location count failed: "+(e.code||e.name));process.exitCode=1})' || true
            echo "== Admin overview Prisma read probe =="
            docker exec mina-api node -e 'const {PrismaClient}=require("./apps/api/dist/prisma/generated/client");const {Pool}=require("pg");const {PrismaPg}=require("@prisma/adapter-pg");const prisma=new PrismaClient({adapter:new PrismaPg(new Pool({connectionString:process.env.DATABASE_URL}))});(async()=>{const [activities,promotions]=await Promise.all([prisma.activity.findMany({orderBy:[{priority:"asc"},{updatedAt:"desc"}]}),prisma.promotion.findMany({orderBy:[{featured:"desc"},{sortOrder:"asc"},{updatedAt:"desc"}],include:{createdBy:{select:{id:true,email:true,firstName:true,lastName:true}},updatedBy:{select:{id:true,email:true,firstName:true,lastName:true}}}})]);console.log(`admin_activities_read=${activities.length}; admin_promotions_read=${promotions.length}`);await prisma.$disconnect()})().catch(async e=>{console.log("Prisma read probe failed: "+(e.code||e.name));await prisma.$disconnect().catch(()=>{});process.exitCode=1})' || true
            echo "== Listening ports =="
            ss -ltnp 2>/dev/null | grep -E ':(3002|3003|3004|3005|3006|4305|13002|13003)([[:space:]]|$)' || true
            echo "== Port 3003 owner =="
            port_pid="$(ss -ltnp 2>/dev/null | awk '$4 ~ /:3003$/ {if (match($0, /pid=[0-9]+/)) print substr($0, RSTART + 4, RLENGTH - 4)}' | head -n 1)"
            if test -n "$port_pid"; then
              ps -o pid,ppid,uid,comm -p "$port_pid" || true
              parent_pid="$(ps -o ppid= -p "$port_pid" | tr -d ' ')"
              if test -n "$parent_pid"; then ps -o pid,ppid,uid,comm -p "$parent_pid" || true; fi
              command -v pstree >/dev/null 2>&1 && pstree -sp "$port_pid" || true
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' readlink "/proc/$port_pid/exe" || true
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' readlink "/proc/$port_pid/cwd" || true
            fi
            echo "== Sudo availability =="
            if sudo -n -v >/dev/null 2>&1; then echo "sudo_with_ssh_password=available"; else echo "sudo_with_ssh_password=unavailable"; fi
            echo "== Nginx Mina routing =="
            command -v nginx || true
            sudo -n nginx -t 2>&1 || true
            sudo -n nginx -T 2>/dev/null | grep -E 'server_name|proxy_pass|listen|configuration file' | grep -Ei 'mina|3002|3003|3004|3005|13002|13003' || true
            echo "== Existing portal certificates =="
            command -v certbot || true
            sudo -n certbot certificates 2>/dev/null | awk '/Certificate Name: minafoundationtz.org/{show=1} show{print} show && /Expiry Date:/{exit}' || true
            echo "== Credential file paths and variable names only =="
            echo "file=/home/opsdc/.creds/zone.env metadata:"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' stat -c 'mode=%a bytes=%s' /home/opsdc/.creds/zone.env 2>/dev/null || true
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' awk -F '[=:]' '!/^[[:space:]]*#/ && NF>1 {key=$1; sub(/^[[:space:]]*export[[:space:]]+/,"",key); gsub(/^[[:space:]]+|[[:space:]]+$/, "", key); if (key ~ /^[A-Za-z_][A-Za-z0-9_]*$/ && key ~ /(cloudflare|(^|_)cf(_|$)|zone|account|root|pass|token|email)/i) print key}' /home/opsdc/.creds/zone.env 2>/dev/null || true
            exit 0
