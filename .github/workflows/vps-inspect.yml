name: Inspect Mina VPS routing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Mina deployment state without changing it
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            echo "== Mina related containers =="
            docker ps -a --format '{{.Names}}|{{.Status}}|{{.Ports}}' | grep -Ei 'mina|travel-engine' || true
            docker inspect --format '{{.Name}}|{{.State.Status}}|{{.Config.Image}}|{{json .NetworkSettings.Ports}}' mina-api 2>/dev/null || true
            echo "== Mina PM2 processes =="
            if command -v pm2 >/dev/null 2>&1; then
              pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s)) if(/mina|travel-engine/i.test(p.name)) console.log(p.name+"|"+p.pm2_env.status)})'
            fi
            echo "== Listening ports =="
            ss -ltnp 2>/dev/null | grep -E ':(3002|3003|3004|13002|13003)([[:space:]]|$)' || true
            echo "== Port 3003 owner =="
            port_pid="$(ss -ltnp 2>/dev/null | awk '$4 ~ /:3003$/ {if (match($0, /pid=[0-9]+/)) print substr($0, RSTART + 4, RLENGTH - 4)}' | head -n 1)"
            if test -n "$port_pid"; then ps -o pid,comm,user -p "$port_pid" || true; readlink "/proc/$port_pid/exe" || true; fi
            echo "== Sudo availability =="
            if sudo -n true 2>/dev/null; then echo "sudo_without_password=available"; else echo "sudo_without_password=unavailable"; fi
            echo "== Nginx Mina routing =="
            command -v nginx || true
            sudo -n nginx -t 2>&1 || true
            sudo -n nginx -T 2>/dev/null | grep -E 'server_name|proxy_pass|listen' | grep -Ei 'mina|3002|3003|3004|13002|13003' || true
            echo "== Existing portal certificates =="
            command -v certbot || true
            sudo -n certbot certificates 2>/dev/null | grep -E 'Certificate Name:|Domains:|Expiry Date:' || true
            echo "== Cloudflare variable names in ~/credits/.env (values hidden) =="
            cf_env="$HOME/credits/.env"
            if test -f "$cf_env"; then
              set -a
              source "$cf_env" >/dev/null
              set +a
              compgen -e | grep -Ei 'cloudflare|(^|_)cf_|zone|account' | sort -u || true
            else
              echo "~/credits/.env=missing"
            fi
