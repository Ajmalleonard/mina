name: Build and deploy changed Mina app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mina-docker-deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          apps=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            apps=(web api mina-panel)
          else
            while IFS= read -r path; do
              case "$path" in
                package.json|package-lock.json|bun.lock|turbo.json|.github/workflows/deploy.yml|deploy/docker-compose.yml|deploy/deploy-service.sh|deploy/*.Dockerfile)
                  apps=(web api mina-panel)
                  break
                  ;;
                apps/web/*) apps+=(web) ;;
                apps/api/*) apps+=(api) ;;
                apps/mina-panel/*) apps+=(mina-panel) ;;
                packages/billing-router/*) apps+=(web api) ;;
              esac
            done < <(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
          fi

          matrix=$(printf '%s\n' "${apps[@]}" | sort -u | jq -R . | jq -sc '{include: map({app: .})}')
          services=$(jq -r '[.include[].app] | join(",")' <<<"$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "services=$services" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.app }}.Dockerfile
          push: true
          tags: ghcr.io/ajmalleonard/mina-${{ matrix.app == 'mina-panel' && 'panel' || matrix.app }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.minafoundationtz.org
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: [changes, build]
    if: needs.changes.outputs.services != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the VPS deployment directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            REPO_DIR="/home/apps/sq/mina"
            mkdir -p "$REPO_DIR/deploy"
            docker info >/dev/null
            docker compose version >/dev/null
            test -f "$REPO_DIR/apps/web/.env"
            test -f "$REPO_DIR/apps/api/.env"
      - name: Upload Compose and deployment script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "deploy/docker-compose.yml,deploy/deploy-service.sh"
          target: "/home/apps/sq/mina/deploy"
          strip_components: 1
      - name: Pull and restart only changed services
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_SERVICES: ${{ needs.changes.outputs.services }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_TAG,DEPLOY_SERVICES,GHCR_TOKEN,GHCR_USERNAME
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /home/apps/sq/mina
            chmod 750 deploy/deploy-service.sh
            ./deploy/deploy-service.sh
